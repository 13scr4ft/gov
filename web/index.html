<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Forces viewport to ignore safe area gaps -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS Full-Bleed PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="gov_wallet_demo">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 1. Reset root body container with Mobile Safari height support */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      height: calc(var(--app-height, 100vh));
      background-color: #073574;
      overflow: hidden;
      position: fixed;
    }

    /* 2. Force Flutter's custom web element to stretch behind notch */
    flutter-view {
      display: block;
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>
</head>
<body style="background-color: #073574;">
  <script>
    // iOS standalone PWAs sometimes report window.innerHeight as the
    // height *excluding* the status bar area, even with viewport-fit=cover
    // and black-translucent set. This measures the real usable height
    // (via visualViewport when available) and feeds it back in as a CSS
    // variable so html/body/flutter-view actually stretch full-screen.
    function setAppHeight() {
      var h = (window.visualViewport && window.visualViewport.height)
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppHeight);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
